    <path d="M1290 560 Q1330 450 1320 330 Q1315 260 1360 190" stroke-width="14"/>
    <path d="M1420 700 Q1500 640 1560 540" stroke-width="12"/>
    <path d="M1190 480 Q1150 400 1160 340" stroke-width="8"/>
