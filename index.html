<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>True Blue Euchre Night</title>
    <!-- Dripping horror lettering for the Halloween theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=true-blue-4" />
  </head>
  <!-- Remove the "halloween" class to go back to the normal look -->
  <body class="true-blue">
    <div class="wave-container"></div>
    <div id="mainContainer">
      <div id="controls">
        <div id="inputContainer">
          <input type="text" id="nameInput" placeholder="Enter player name" aria-label="Player name" />
          <button id="addNameButton" aria-label="Add player">+</button>
        </div>
        <ul id="nameList"></ul>
        <button class="button-79" role="button" id="spinButton">Spin</button>
      </div>
      <div id="wheelContainer">
        <div id="wheelWrap">
          <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>
      </div>
    </div>
    <!-- Sits behind the winner screen so its bounce never shows the page -->
    <div id="modalBackdrop"></div>
    <div id="modal" class="modal">
      <!-- HALLOWEEN winner scene, inline so script.js can recolor the moon
           (works even when index.html is opened straight from a file) -->
      <div class="winner-scene" aria-hidden="true">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
          <circle id="moon" cx="800" cy="400" r="280" fill="#2475dd" opacity=".35"/>
          <path fill="#123d82" d="M0 540 Q200 400 400 540 T800 540 T1200 540 T1600 540 V900 H0Z"/>
          <path fill="#2475dd" d="M0 650 Q200 490 400 650 T800 650 T1200 650 T1600 650 V900 H0Z"/>
          <path fill="#71c2f5" d="M0 770 Q200 630 400 770 T800 770 T1200 770 T1600 770 V900 H0Z"/>
        </svg>
      </div>
      <div class="modal-content">
        <h2 id="winnerName"></h2>
        <button class="button-79" role="button" id="playAgainButton">
          Play Again
        </button>
      </div>
    </div>
    <!-- Reaches in to flick the wheel when Spin is clicked -->

    <script src="script.js?v=true-blue-4"></script>
  </body>
</html>
